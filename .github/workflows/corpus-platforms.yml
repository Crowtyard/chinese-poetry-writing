name: Corpus Windows and Linux
on:
  push:
    paths: ['scripts/**', 'tests/**', 'requirements-corpus.txt', '.github/workflows/corpus-platforms.yml']
  pull_request:
    paths: ['scripts/**', 'tests/**', 'requirements-corpus.txt', '.github/workflows/corpus-platforms.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cold-install:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fresh corpus, repeat setup, all tests, fallback queries
        env:
          PYTHONUTF8: '1'
        run: python tests/smoke_fresh_install.py
